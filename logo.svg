<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Emerald Glow Highlight -->
    <radialGradient id="emeraldGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Neon Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.5" />
    </linearGradient>

    <!-- Filter for Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#011b15" flood-opacity="0.5" />
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#badgeShadow)" stroke="url(#ringGrad)" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#emeraldGlow)" />

  <!-- 2. QR Code Corner Finders (Stylized Tech Cornerstones) -->
  <!-- Top-Left QR Eye -->
  <g transform="translate(68, 68)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="none" stroke="#ffffff" stroke-width="12" />
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#mintGrad)" />
  </g>

  <!-- Top-Right QR Eye -->
  <g transform="translate(356, 68)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="none" stroke="#ffffff" stroke-width="12" />
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#mintGrad)" />
  </g>

  <!-- Bottom-Left QR Eye -->
  <g transform="translate(68, 356)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="none" stroke="#ffffff" stroke-width="12" />
    <rect x="20" y="20" width="48" height="48" rx="12" fill="url(#mintGrad)" />
  </g>

  <!-- Bottom-Right: Verified Payment Shield Badge -->
  <g transform="translate(356, 356)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#022c22" stroke="url(#mintGrad)" stroke-width="6" />
    <!-- Checkmark -->
    <path d="M26 44 L38 56 L62 30" fill="none" stroke="url(#mintGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3. Geometric Tech Grid Dots (QR Matrix Nodes) -->
  <circle cx="196" cy="112" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="236" cy="112" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="276" cy="112" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="316" cy="112" r="8" fill="#ffffff" opacity="0.5" />

  <circle cx="112" cy="196" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="112" cy="236" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="112" cy="276" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="112" cy="316" r="8" fill="#34d399" opacity="0.7" />

  <circle cx="400" cy="196" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="400" cy="236" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="400" cy="276" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="400" cy="316" r="8" fill="#ffffff" opacity="0.5" />

  <circle cx="196" cy="400" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="236" cy="400" r="8" fill="#34d399" opacity="0.7" />
  <circle cx="276" cy="400" r="8" fill="#ffffff" opacity="0.5" />
  <circle cx="316" cy="400" r="8" fill="#34d399" opacity="0.7" />

  <!-- 4. Centerpiece: Classical Bank Gateway Arch & Pakistani Crescent + Star -->
  <!-- Bank Gateway Dome & Pillars Silhouette -->
  <g opacity="0.95">
    <!-- Bank Pediment / Roof Roof Peak -->
    <path d="M 184 200 L 256 160 L 328 200 Z" fill="#ffffff" opacity="0.9" />
    <!-- Pediment Arch Base Line -->
    <rect x="180" y="204" width="152" height="8" rx="4" fill="#ffffff" opacity="0.8" />

    <!-- 4 Bank Pillars -->
    <rect x="194" y="218" width="14" height="114" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="230" y="218" width="14" height="114" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="268" y="218" width="14" height="114" rx="4" fill="#ffffff" opacity="0.4" />
    <rect x="304" y="218" width="14" height="114" rx="4" fill="#ffffff" opacity="0.4" />

    <!-- Bank Base Foundation -->
    <rect x="180" y="336" width="152" height="10" rx="5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- 5. Iconic Pakistani Crescent and Star (Centrally Elevated Emblem) -->
  <g transform="translate(256, 268) scale(1.15)">
    <!-- Crescent Moon Shadow/Glow -->
    <path d="M 2 32 A 44 44 0 1 0 -22 -36 A 35 35 0 1 1 2 32 Z"
          fill="#ffffff" filter="url(#glowFilter)" opacity="0.95" />
    
    <!-- 5-Pointed Star tilted 45° -->
    <polygon points="18,-18 24,-6 36,-10 28,-1 36,9 23,7 18,18 12,7 -1,9 7,-1 -1,-10 12,-6"
             fill="url(#goldGrad)" />
  </g>

  <!-- 6. Bottom Brand Banner Tab -->
  <g transform="translate(146, 396)">
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#022c22" stroke="url(#mintGrad)" stroke-width="2" />
    <text x="110" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3.5">PAKBANK QR</text>
  </g>
</svg>
